services:
  web:
    image: nginx:1.27-alpine
    environment:
      - PORT=${PORT:-18060}
    ports:
      - "${PORT:-18060}:${PORT:-18060}"
    # dev.wireops.config.<name>: "<repo-relative source>:<in-container target>"
    # No wireops.yaml involvement at all — the server resolves the source
    # straight from this repo checkout and synthesizes the compose
    # `configs:` block into the rendered file. A directory source (like
    # files/html below) is expanded recursively: every file under it becomes
    # its own config entry, mounted under the declared target directory.
    #
    # nginx.conf.template lands in /etc/nginx/templates/, where the official
    # nginx image's entrypoint envsubst's it (only real env vars, nginx's own
    # $uri/$host stay untouched) into conf.d/default.conf at container start.
    # Host and container use the same PORT, so no docker port-remap mismatch —
    # that mismatch is what caused nginx's internal redirects (trailing slash,
    # etc) to always point at :80 regardless of the published port.
    annotations:
      dev.wireops.config.nginx-conf: files/nginx.conf.template:/etc/nginx/templates/default.conf.template
      dev.wireops.config.html: files/html:/usr/share/nginx/html
    labels:
      - "customization.image.slug=nginx"
    restart: unless-stopped
