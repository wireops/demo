services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "18060:80"
    # The configs themselves are declared as name+path entries in
    # wireops.yaml (source: files/nginx.conf, files/index.html). This
    # annotation just tells wireops which of those configs this service
    # mounts and where — the server resolves the file content and
    # synthesizes the actual compose `configs:` block into the rendered
    # file, so this raw compose file never needs to declare `configs:`
    # itself, no stub/placeholder entries needed.
    annotations:
      dev.wireops.config.nginx-conf: /etc/nginx/conf.d/default.conf
      dev.wireops.config.index-html: /usr/share/nginx/html/index.html
    labels:
      - "customization.image.slug=nginx"
    restart: unless-stopped
